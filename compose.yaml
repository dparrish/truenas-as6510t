services:
  asustor-frontpanel:
    image: asustor-frontpanel:0.1.14
    pull_policy: never
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      TRUENAS_API_URL: "wss://192.168.1.5/api/current"
      TRUENAS_API_USERNAME: "dparrish"
      TRUENAS_TLS_VERIFY: "false"
      # Replace this with the API key created for this app.
      TRUENAS_API_KEY: "REPLACE_WITH_TRUENAS_API_KEY"
      LCD_DEVICE: /host-dev/ttyS1
      POLL_SECONDS: "300"
      LCD_STARTUP_DELAY_SECONDS: "3"
      STATUS_LINE1: "TrueNAS AS6510T"
      # Override this after verifying physical bay order. The default below
      # matches the current NAS disk enumeration (sda through sde).
      BAY_DEVICE_MAP: "1=/host-dev/sda,2=/host-dev/sdb,3=/host-dev/sdc,4=/host-dev/sdd,5=/host-dev/sde"
    volumes:
      - /dev:/host-dev
      - /sys:/host-sys:ro
      - /run/udev:/host-run/udev:ro
